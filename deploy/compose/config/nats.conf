# NATS JetStream WAL for the single-node stack (Story 5.1).
#
# The gateway batches up to 4 MiB per WAL message (OBSERVAKI_NATS_BATCH_MAX_BYTES),
# so max_payload must be raised above the 1 MiB NATS default. Store and limits
# mirror the T1 defaults scaled down to a single node: each signal stream keeps
# 2 GiB (OBSERVAKI_NATS_STREAM_MAX_BYTES in compose.yaml) and the default 8 GiB
# DLQ, all under max_file_store.
port: 4222
http_port: 8222
max_payload: 16777216

jetstream {
  store_dir: "/data/js"
  max_memory_store: 256MB
  # Three 2 GiB signal streams plus the 8 GiB DLQ (Story 4.4) must fit.
  max_file_store: 16GB
}
