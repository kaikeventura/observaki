{{- if and (eq .Values.dependencies.mode "bundled") (not .Values.clickhouse.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "observaki.fullname" . }}-clickhouse
  labels:
    {{- include "observaki.componentLabels" (dict "root" . "component" "clickhouse") | nindent 4 }}
type: Opaque
stringData:
  user: {{ .Values.clickhouse.auth.username | quote }}
  password: {{ .Values.clickhouse.auth.password | quote }}
{{- end }}
{{- if and (eq .Values.dependencies.mode "bundled") (not .Values.postgres.auth.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "observaki.fullname" . }}-postgres
  labels:
    {{- include "observaki.componentLabels" (dict "root" . "component" "postgres") | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.postgres.auth.password | quote }}
  database-url: {{ printf "postgres://%s:%s@%s-postgres:5432/%s?sslmode=disable" .Values.postgres.auth.username .Values.postgres.auth.password (include "observaki.fullname" .) .Values.postgres.auth.database | quote }}
{{- end }}
{{- if .Values.gateway.auth.devSnapshot }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "observaki.fullname" . }}-ingest-auth
  labels:
    {{- include "observaki.componentLabels" (dict "root" . "component" "gateway") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.gateway.auth.snapshotKey }}: |-
    {{- .Files.Get "files/ingest-auth-dev.json" | nindent 4 }}
{{- end }}
