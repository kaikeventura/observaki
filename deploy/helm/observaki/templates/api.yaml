apiVersion: v1
kind: Service
metadata:
  name: {{ include "observaki.fullname" . }}-api
  labels:
    {{- include "observaki.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "observaki.componentSelectorLabels" (dict "root" . "component" "api") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "observaki.fullname" . }}-api
  labels:
    {{- include "observaki.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "observaki.componentSelectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "observaki.componentLabels" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        checksum/config: {{ printf "%s|%s|%s|%s" (include "observaki.postgresSecretName" .) (include "observaki.postgresSecretKey" .) .Values.logLevel .Chart.AppVersion | sha256sum }}
    spec:
      serviceAccountName: {{ include "observaki.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ include "observaki.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/observaki", "serve"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OBSERVAKI_ENV
              value: {{ .Values.environment | quote }}
            - name: OBSERVAKI_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: OBSERVAKI_HTTP_ADDR
              value: ":8080"
            - name: OBSERVAKI_WEB_DIR
              value: /srv/web
            - name: OBSERVAKI_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "observaki.postgresSecretName" . }}
                  key: {{ include "observaki.postgresSecretKey" . }}
            # Story 5.4 auto-observability and internal alerting.
            - name: OBSERVAKI_SELF_WRITER_URL
              value: "http://{{ include "observaki.fullname" . }}-writer:8082"
            - name: OBSERVAKI_SELF_GATEWAY_URL
              value: "http://{{ include "observaki.fullname" . }}-gateway:{{ .Values.gateway.service.httpPort }}"
            - name: OBSERVAKI_SELF_NATS_MONITOR_URL
              value: "http://{{ include "observaki.fullname" . }}-nats:8222"
            - name: OBSERVAKI_SELF_REFRESH_INTERVAL
              value: {{ .Values.selfObservability.refreshInterval | quote }}
            - name: OBSERVAKI_SELF_TIMEOUT
              value: {{ .Values.selfObservability.timeout | quote }}
            - name: OBSERVAKI_SELF_INGEST_LAG_THRESHOLD
              value: {{ .Values.selfObservability.ingestLagThreshold | quote }}
            - name: OBSERVAKI_ALERTING_ENABLED
              value: {{ .Values.alerting.enabled | quote }}
            - name: OBSERVAKI_ALERTING_INTERVAL
              value: {{ .Values.alerting.interval | quote }}
            - name: OBSERVAKI_ALERTING_DELIVERY_INTERVAL
              value: {{ .Values.alerting.deliveryInterval | quote }}
            - name: OBSERVAKI_ALERTING_TIMEOUT
              value: {{ .Values.alerting.timeout | quote }}
          {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 6
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.api.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "observaki.fullname" . }}-api
  labels:
    {{- include "observaki.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "observaki.componentSelectorLabels" (dict "root" . "component" "api") | nindent 6 }}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "observaki.fullname" . }}-api
  labels:
    {{- include "observaki.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "observaki.fullname" $ }}-api
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
