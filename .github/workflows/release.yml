name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  binaries:
    name: Build binaries
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build server binaries
        run: |
          mkdir -p dist
          commit="${GITHUB_SHA::7}"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-X github.com/observaki/observaki/internal/version.Version=${GITHUB_REF_NAME} \
                -X github.com/observaki/observaki/internal/version.Commit=${commit} \
                -X github.com/observaki/observaki/internal/version.Date=${date}" \
              -o "dist/observaki-linux-${arch}" ./cmd/observaki
          done

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build agent (amd64)
        run: |
          cargo build --release --manifest-path agent/Cargo.toml
          cp agent/target/release/observaki-agent dist/observaki-agent-linux-amd64

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build agent (arm64)
        run: |
          cross build --release --target aarch64-unknown-linux-gnu \
            --manifest-path agent/Cargo.toml
          cp agent/target/aarch64-unknown-linux-gnu/release/observaki-agent \
            dist/observaki-agent-linux-arm64

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*
          retention-days: 7

  image:
    name: Publish signed image
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless)
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

  release:
    name: Publish release assets
    needs: [binaries, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOMs
        run: |
          for file in dist/observaki-linux-* dist/observaki-agent-linux-*; do
            syft "file:${file}" -o cyclonedx-json > "${file}.cdx.json"
          done

      - name: Checksums
        working-directory: dist
        run: sha256sum observaki-* > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts (keyless)
        working-directory: dist
        run: |
          for file in *; do
            case "$file" in
            *.sigstore.json) continue ;;
            esac
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "$file"
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Observaki ${GITHUB_REF_NAME}" \
            --notes "Alpha release. Verify every artifact with cosign verify-blob and check SHA256SUMS." \
            dist/*
