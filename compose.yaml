# Observaki single-node stack (Story 5.1).
#
#   docker compose up -d --build --wait      # or: make compose-up
#
# Everything is built from this checkout and binds to 127.0.0.1 only. This is
# an evaluation/development stack, not a hardened deployment: ClickHouse and
# PostgreSQL run with local development credentials and the ingest token in
# deploy/compose/config/ingest-auth.json is public on purpose. See
# deploy/compose/README.md for the ports, the data volumes and the limits.
name: observaki

x-observaki-image: &observaki-image
  # OBSERVAKI_IMAGE selects a prebuilt tag for the upgrade/rollback drill;
  # normal use builds `observaki:local`.
  image: ${OBSERVAKI_IMAGE:-observaki:local}
  build:
    context: .
    dockerfile: deploy/compose/Dockerfile
    args:
      VERSION: ${OBSERVAKI_VERSION:-dev}
      COMMIT: ${OBSERVAKI_COMMIT:-none}
      BUILD_DATE: ${OBSERVAKI_BUILD_DATE:-unknown}
  restart: unless-stopped

x-observaki-env: &observaki-env
  OBSERVAKI_ENV: development
  OBSERVAKI_LOG_LEVEL: ${OBSERVAKI_LOG_LEVEL:-info}
  OBSERVAKI_NATS_URL: nats://nats:4222

x-observaki-healthcheck: &observaki-healthcheck
  interval: 5s
  timeout: 5s
  retries: 24
  start_period: 15s

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./deploy/compose/config/clickhouse.xml:/etc/clickhouse-server/config.d/observaki.xml:ro
    ports:
      - "127.0.0.1:8123:8123"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # Applies the versioned, additive migrations on every start. The migrations
  # are idempotent, so a restart never needs a manual step (AC3).
  clickhouse-migrate:
    image: clickhouse/clickhouse-server:26.8
    restart: "no"
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_DATABASE: observaki
    volumes:
      - ./internal/adapters/clickhouse/migrations:/migrations:ro
      - ./deploy/compose/scripts/clickhouse-migrate.sh:/usr/local/bin/clickhouse-migrate.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/clickhouse-migrate.sh"]

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.148.0
    restart: unless-stopped
    command:
      - -storageDataPath=/victoria-metrics-data
      - -httpListenAddr=:8428
      - -retentionPeriod=1
    volumes:
      - victoriametrics-data:/victoria-metrics-data
    ports:
      - "127.0.0.1:8428:8428"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${OBSERVAKI_POSTGRES_DB:-observaki}
      POSTGRES_USER: ${OBSERVAKI_POSTGRES_USER:-observaki}
      POSTGRES_PASSWORD: ${OBSERVAKI_POSTGRES_PASSWORD:-observaki-local-dev}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Applies the versioned PostgreSQL control-plane migrations and seeds the
  # development metadata on every start (Story 5.4). Idempotent.
  postgres-migrate:
    <<: *observaki-image
    restart: "no"
    command: ["migrate", "--seed-dev"]
    environment:
      <<: *observaki-env
      OBSERVAKI_DATABASE_URL: postgres://${OBSERVAKI_POSTGRES_USER:-observaki}:${OBSERVAKI_POSTGRES_PASSWORD:-observaki-local-dev}@postgres:5432/${OBSERVAKI_POSTGRES_DB:-observaki}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  nats:
    image: nats:2.15.2-alpine
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - nats-data:/data
      - ./deploy/compose/config/nats.conf:/etc/nats/nats.conf:ro
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  observaki-api:
    <<: *observaki-image
    command: ["serve"]
    environment:
      <<: *observaki-env
      OBSERVAKI_HTTP_ADDR: ":8080"
      OBSERVAKI_WEB_DIR: /srv/web
      OBSERVAKI_DATABASE_URL: postgres://${OBSERVAKI_POSTGRES_USER:-observaki}:${OBSERVAKI_POSTGRES_PASSWORD:-observaki-local-dev}@postgres:5432/${OBSERVAKI_POSTGRES_DB:-observaki}?sslmode=disable
      # Self-observability sources (Story 5.4 AC3). The API scrapes the data
      # plane's own health/metrics endpoints and never queries CH/VM (AD-3).
      OBSERVAKI_SELF_WRITER_URL: http://observaki-writer:8082
      OBSERVAKI_SELF_GATEWAY_URL: http://observaki-gateway:4318
      OBSERVAKI_SELF_NATS_MONITOR_URL: http://nats:8222
      OBSERVAKI_SELF_REFRESH_INTERVAL: 5s
      OBSERVAKI_SELF_TIMEOUT: 3s
      OBSERVAKI_SELF_INGEST_LAG_THRESHOLD: 10s
      # Internal alerting (Story 5.4 AC4). The seeded rule/channel live in
      # PostgreSQL; the drill points the webhook at the host sink.
      OBSERVAKI_ALERTING_ENABLED: "true"
      OBSERVAKI_ALERTING_INTERVAL: 5s
      OBSERVAKI_ALERTING_DELIVERY_INTERVAL: 2s
      OBSERVAKI_ALERTING_TIMEOUT: 5s
    # The seeded webhook channel and the operator drill reach a receiver on the
    # Docker host (Linux host-gateway).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      <<: *observaki-healthcheck
      test: ["CMD", "/observaki", "healthcheck", "--url", "http://127.0.0.1:8080/healthz"]

  observaki-gateway:
    <<: *observaki-image
    command: ["gateway"]
    environment:
      <<: *observaki-env
      OBSERVAKI_OTLP_GRPC_ADDR: ":4317"
      OBSERVAKI_OTLP_HTTP_ADDR: ":4318"
      OBSERVAKI_INGEST_AUTH_FILE: /etc/observaki/ingest-auth.json
      # Single-node evaluation budget: 2 GiB of WAL per signal on the NATS
      # volume. The T1 profile uses the 16 GiB default (Story 4.5).
      OBSERVAKI_NATS_STREAM_MAX_BYTES: "2147483648"
    volumes:
      - ./deploy/compose/config/ingest-auth.json:/etc/observaki/ingest-auth.json:ro
    depends_on:
      nats:
        condition: service_healthy
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    healthcheck:
      <<: *observaki-healthcheck
      test: ["CMD", "/observaki", "healthcheck", "--url", "http://127.0.0.1:4318/readyz"]

  observaki-writer:
    <<: *observaki-image
    command: ["writer"]
    environment:
      <<: *observaki-env
      OBSERVAKI_WRITER_ADDR: ":8082"
      OBSERVAKI_WRITER_SPOOL_DIR: /var/lib/observaki/spool
      OBSERVAKI_CLICKHOUSE_URL: http://clickhouse:8123
      OBSERVAKI_CLICKHOUSE_DATABASE: observaki
      OBSERVAKI_VICTORIAMETRICS_URL: http://victoriametrics:8428
    volumes:
      - writer-spool:/var/lib/observaki/spool
    depends_on:
      clickhouse-migrate:
        condition: service_completed_successfully
      victoriametrics:
        condition: service_healthy
      # The gateway creates the three WAL streams; the writer fails closed
      # until they exist (Story 4.4).
      observaki-gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8082"
    healthcheck:
      <<: *observaki-healthcheck
      test: ["CMD", "/observaki", "healthcheck", "--url", "http://127.0.0.1:8082/readyz"]

volumes:
  clickhouse-data:
  victoriametrics-data:
  postgres-data:
  nats-data:
  writer-spool:
